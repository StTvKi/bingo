<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <img class="header-image" src="header.svg" alt="Norge mot Brasil" />

    <section class="start-screen" id="startScreen">
      <div class="start-box">
        <label for="playerNameInput">Skriv inn navnet ditt</label>
        <input id="playerNameInput" type="text" placeholder="Navn" />
        <button id="startButton">Start bingo</button>
      </div>
    </section>

    <section class="game-screen" id="gameScreen">
      <div class="player-name" id="playerName"></div>
      <div class="board" id="board"></div>
    </section>

    <div class="full-bingo-message" id="fullBingoMessage">
      🎉 Gratulerer!!!
    </div>

    <button class="play-again-button" id="playAgainButton">
      Spill igjen
    </button>
  </main>

  <script src="bingo.js"></script>
</body>
</html>
