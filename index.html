<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <img class="header-image" src="header.svg" alt="Kampheader" />

    <section class="start-screen" id="startScreen">
      <div class="start-box">
        <label for="playerNameInput">Skriv inn navnet ditt</label>
        <input id="playerNameInput" type="text" placeholder="Navn" />

        <label>Hva tipper du resultatet blir?</label>

        <div class="prediction-inputs">
          <input id="homeScoreInput" type="number" min="0" placeholder="Hjemmelag" />
          <span>-</span>
          <input id="awayScoreInput" type="number" min="0" placeholder="Bortelag" />
        </div>

        <button id="startButton">Lag mitt bingobrett</button>
      </div>
    </section>

    <section class="game-screen" id="gameScreen">
      <div class="player-name" id="playerName"></div>

      <div class="live-score-box">
        <span>Score:</span>
        <strong id="liveScoreDisplay">0 poeng</strong>
      </div>

      <div class="board" id="board"></div>

      <div class="actual-score-box">
        <label>Stilling nå</label>

        <div class="score-counter">
          <div class="team-score">
            <div class="team-name" id="actualHomeTeamName"></div>
            <div class="score-controls">
              <button type="button" id="actualHomeMinusButton">−</button>
              <span id="actualHomeScoreDisplay">0</span>
              <button type="button" id="actualHomePlusButton">+</button>
            </div>
          </div>

          <div class="score-divider">-</div>

          <div class="team-score">
            <div class="team-name" id="actualAwayTeamName"></div>
            <div class="score-controls">
              <button type="button" id="actualAwayMinusButton">−</button>
              <span id="actualAwayScoreDisplay">0</span>
              <button type="button" id="actualAwayPlusButton">+</button>
            </div>
          </div>
        </div>
      </div>

      <button class="finish-button" id="finishButton">
        Se poeng og oppsummering
      </button>
    </section>

    <section class="summary-screen" id="summaryScreen">
      <div class="summary-box">
        <h1 id="summaryTitle"></h1>

        <div class="summary-match-card">
          <p id="summaryMatch"></p>
          <p id="summaryPrediction"></p>
          <p id="summaryActualResult"></p>
        </div>

        <div class="summary-card">
          <h2>Resultatbonus</h2>

          <div class="summary-row">
            <span>Riktig vinner/uavgjort</span>
            <strong id="summaryWinnerPoints"></strong>
          </div>

          <div class="summary-row">
            <span id="summaryHomeGoalLabel"></span>
            <strong id="summaryHomeGoalPoints"></strong>
          </div>

          <div class="summary-row">
            <span id="summaryAwayGoalLabel"></span>
            <strong id="summaryAwayGoalPoints"></strong>
          </div>

          <div class="summary-row">
            <span>Helt riktig resultat</span>
            <strong id="summaryExactScorePoints"></strong>
          </div>

          <div class="summary-row summary-total-row">
            <span>Resultatbonus totalt</span>
            <strong id="summaryPredictionPoints"></strong>
          </div>
        </div>

        <div class="summary-card">
          <h2>Bingopoeng</h2>

          <div class="summary-row">
            <span id="summarySquaresLabel"></span>
            <strong id="summarySquares"></strong>
          </div>

          <div class="summary-row">
            <span id="summaryLinesLabel"></span>
            <strong id="summaryLines"></strong>
          </div>

          <div class="summary-row summary-total-row">
            <span>Ruter + bingo totalt</span>
            <strong id="summaryBoardPoints"></strong>
          </div>
        </div>

        <div class="summary-final" id="summaryScore"></div>

        <button id="backToBoardButton">Tilbake til brettet</button>
        <button id="newGameButton" class="secondary-button">Nytt brett</button>
      </div>
    </section>
  </main>

  <script src="bingo.js"></script>
</body>
</html>
